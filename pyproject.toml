[project]
name = "pickleball-tracking"
version = "0.2.0"
description = "Multi-pickleball detection and edge-ready tracking"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
edge = ["onnxruntime>=1.19,<2"]
training = ["torch>=2,<3", "ultralytics>=8.3,<9"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["datasets", "outputs", "artifacts", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
