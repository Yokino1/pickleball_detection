schema_version: 1

input:
  source: data/reference/test_2.mp4

detector:
  backend: auto
  model: artifacts/models/ball_best.pt
  ball_class_id: 0
  imgsz: 960
  low_conf: 0.15
  iou_threshold: 0.50
  max_detections: 32
  duplicate_iou_threshold: 0.20
  duplicate_center_scale: 0.75
  duplicate_center_px: 6.0
  device: null
  exclude_region: null

tracker:
  high_conf: 0.25
  low_conf: 0.15
  min_hits: 2
  max_predict_frames: 8
  max_missing_frames: 20
  base_gate_px: 55.0
  max_gate_px: 180.0
  gate_growth_px: 15.0
  velocity_gate_scale: 0.8
  tentative_gate_px: 150.0
  max_speed_px_per_frame: 120.0
  reference_frame_width: 1280.0
  require_motion_confirmation: true
  motion_threshold_px: 12.0
  max_stationary_frames: 30
  unconfirmed_max_frames: 30
  max_output_tracks: 0
  impact_recovery_gate_px: 260.0
  impact_recovery_min_speed_px: 15.0
  prediction_min_confidence: 0.15
  fast_prediction_speed_px: 40.0
  fast_max_predict_frames: 3
  prediction_velocity_decay: 0.90
  min_motion_speed_px: 0.8
  confidence_decay: 0.82
  process_noise: 12.0
  measurement_noise: 4.0
  max_tracks: 32
  emit_tentative: false

runtime:
  detector_interval: 1
  fail_on_detector_error: true
  camera_motion:
    enabled: true
    analysis_width: 640
    max_corners: 300
    min_inliers: 20
    max_shift_px: 80.0
    ransac_threshold_px: 2.5

output:
  video: outputs/tracking_overlay.mp4
  jsonl: outputs/tracking.jsonl
  codec: mp4v
  trail_length: 30
  draw_raw_detections: false
