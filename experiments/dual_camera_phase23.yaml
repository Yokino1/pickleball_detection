limitations:
  - This is a historical revision-2 smoke record, not the current official configuration.
  - The exact revision-2 YAML is not retained; the archived revision-4 file is a later
    experiment snapshot and must not be presented as exact phase-23 reproduction.
  - Fast-motion proposals were covered synthetically but did not activate in the 30-frame real smoke.
  - Camera coordinates are independent; no calibrated cross-camera position mapping is claimed.
  - Two-dimensional person boxes do not prove paddle contact.
promotion_gate:
